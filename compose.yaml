services:
  mongo:
    image: mongo:8
    container_name: mongodbserver-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:9812:27017"
    # Small-VPS guardrails (see README "Memory footprint"):
    # - WiredTiger cache pinned instead of the auto-tuned default, so mongod
    #   cannot grow into the JVM's share of RAM.
    # - Connection cap (--maxConns): every client connection costs mongod
    #   ~0.5-1MB of RAM; 500 bound the blast radius of a misbehaving tenant
    #   app (raise if needed).
    command: ["--wiredTigerCacheSizeGB", "0.25", "--maxConns", "500"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    mem_limit: 650m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-root}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "${MONGODB_ROOT_USERNAME:-root}", "-p", "${MONGODB_ROOT_PASSWORD:-root}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: mongodbserver-mongo-express
    restart: unless-stopped
    ports:
      # Loopback only: the UI is reachable through the admin app proxy at /mongo-express
      - "127.0.0.1:9814:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-root}:${MONGODB_ROOT_PASSWORD:-root}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
      ME_CONFIG_SITE_BASEURL: /mongo-express
    depends_on:
      - mongo

  postgres:
    image: postgres:18.6-alpine
    container_name: mongodbserver-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:9813:5432"
    # Enterprise hardening: scram-sha-256 is PG18 default; explicit command keeps it
    # pinned even if image defaults change.
    # TLS (verify-full with CA) — uncomment and provide certs:
    #   volumes:
    #     - postgres-data:/var/lib/postgresql
    #     - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
    #     - ./certs/server.key:/var/lib/postgresql/server.key:ro
    #     - ./certs/ca.crt:/var/lib/postgresql/ca.crt:ro
    #   command: ["postgres",
    #     "-c", "password_encryption=scram-sha-256",
    #     "-c", "ssl=on",
    #     "-c", "ssl_cert_file=/var/lib/postgresql/server.crt",
    #     "-c", "ssl_key_file=/var/lib/postgresql/server.key",
    #     "-c", "ssl_ca_file=/var/lib/postgresql/ca.crt"]
    #   # pg_hba.conf: hostssl all all 0.0.0.0/0 scram-sha-256
    #   # .env: POSTGRES_PUBLIC_SSLMODE=verify-full
    #   #       POSTGRES_URI=jdbc:postgresql://127.0.0.1:9813/postgres?sslmode=verify-full&sslrootcert=./certs/ca.crt
    #   # Issued connection strings then carry sslmode=verify-full.
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-root}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
      # For verify-full, also mount certs (see commented example above):
      # - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      # - ./certs/server.key:/var/lib/postgresql/server.key:ro
      # - ./certs/ca.crt:/var/lib/postgresql/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:6.0.1-standalone
    container_name: mongodbserver-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9815:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  mongo-data:
  postgres-data:
