# Database Proxy — Nginx stream, TLS passthrough + SNI routing (pooled-only public).
# Rendered with envsubst at deploy (compose passes the pooled hostname).
#   pooled-host:14291 -> pgbouncer:6432 -> postgres:5432 (POOLED, transaction)
# Direct has NO public route (loopback on-box, SSH tunnel from outside) — one
# hostname cannot serve both links because SNI routing cannot split it. To add
# a direct link later, add a second hostname + map entry (never a default).
# Unknown/missing SNI has NO route (fail closed — never falls back).
# The proxy never sees tenant passwords (passthrough, not termination).
# Requires nginx built with --with-stream_ssl_preread_module (official image: yes).
#
# TLS legs (passthrough — nginx never terminates, never sees credentials):
#   leg 1 (client -> nginx -> backend): ONE end-to-end TLS session, terminated
#     at PostgreSQL (direct route) or at PgBouncer (pooled route, which REQUIRES
#     client_tls_sslmode=require + client_tls_cert/key — see compose pgbouncer-init).
#   leg 2 (pooler -> postgres, pooled route only): SEPARATE session owned by
#     PgBouncer (server_tls_sslmode=require). server verify-full is NOT used:
#     the pooler dials internal hostname `postgres`, which the public-SAN cert
#     does not cover, so `require` gives encryption without an unpassable
#     hostname check. `sslmode=require` on the client fails CLOSED against a
#     plaintext pooler (notably the negative test T5 below).

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    # SNI-indexed backends. Exact hostnames only — no wildcards.
    # Single-entry map: the one public hostname routes to the pooler.
    # (Dual-link later = second hostname + second entry. Never add a default.)
    map $$ssl_preread_server_name $$pg_backend {
        ${DATABASE_PROXY_POOLED_HOST}  postgres_pooled;
        default                        blackhole;
    }

    upstream postgres_pooled {
        server pgbouncer:6432 max_fails=2 fail_timeout=10s;
    }

    # Deliberately no upstream named "blackhole": unknown SNI is refused
    # and logged with the presented SNI for audit.

    log_format pg_proxy '$$remote_addr [$$time_local] sni=$$ssl_preread_server_name '
                        'backend=$$pg_backend bytes_sent=$$bytes_sent bytes_received=$$bytes_received '
                        'session_time=$$session_time status=$$status';

    server {
        listen 14291;
        ssl_preread on;
        proxy_pass $$pg_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        access_log /var/log/nginx/pg-proxy.log pg_proxy;
    }
}
