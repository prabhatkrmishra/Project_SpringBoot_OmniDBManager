# Database Proxy — plain TCP passthrough to the pooler (pooled-only public).
# Rendered with envsubst at deploy (compose passes the pooled hostname only
# for documentation/logging; routing does NOT depend on it).
#
# WHY NOT SNI ROUTING: stock PostgreSQL clients (libpq, JDBC, psql) open with
# a cleartext SSLRequest and wait for the server's S/N reply BEFORE sending
# TLS — there is no ClientHello for a passive ssl_preread to inspect, so SNI
# inspection deadlocks (client waits for S/N, proxy waits for ClientHello).
# SNI routing would require a PG-protocol-aware proxy that answers the
# SSLRequest itself (like Neon's proxy), or clients with sslnegotiation=direct
# (PG17+ libpq only — unacceptable as a public contract). With a single
# backend there is nothing to select anyway: every byte goes to the pooler,
# TLS stays end-to-end (pooler terminates client TLS), and SCRAM is the
# access boundary. Adding a second public link later needs either a second
# port or a protocol-aware proxy — NOT an nginx ssl_preread map.
#
#   <any SNI>:14291 -> pgbouncer:6432 -> postgres:5432 (POOLED, transaction)
# Direct has NO public route (loopback on-box, SSH tunnel from outside).

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    # Docker embedded DNS, re-resolved every few seconds: nginx dials the
    # pooler by container name, and names must track pooler recreates
    # (startup-only resolution kept dialing a dead IP after recreates).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # A variable proxy_pass is what makes nginx consult the resolver above
    # (a static upstream group is resolved once at startup). The map key is
    # irrelevant — every connection on this port goes to the pooler.
    map $server_port $pg_backend {
        default  pgbouncer:6432;
    }

    log_format pg_proxy '$remote_addr [$time_local] '
                        'backend=$pg_backend bytes_sent=$bytes_sent bytes_received=$bytes_received '
                        'session_time=$session_time status=$status';

    server {
        listen 14291;
        proxy_pass $pg_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        access_log /var/log/nginx/pg-proxy.log pg_proxy;
    }
}
