# Java CI with Maven: build + tests on every push/PR to main.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Check for secrets in repo
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked in git. Remove it immediately."
            exit 1
          fi
          if [ -f .env ]; then
            echo "ERROR: .env exists in workspace. Remove it before building."
            exit 1
          fi

      - name: Build with Maven
        env:
          MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        run: mvn -B clean package --file pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of
      # Dependabot alerts this repository can receive.
      # Skipped on PRs — fork PRs cannot write to the dependency graph (403).
      - name: Update dependency graph
        if: github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          ignore-maven-wrapper: true
