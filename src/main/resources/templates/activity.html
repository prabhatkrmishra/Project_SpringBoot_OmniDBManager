<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Activity')}"></head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments/nav :: nav('activity')}"></aside>

        <div class="main">
            <main th:replace="~{fragments/nav :: flash}"></main>

            <main class="container-xxl py-4">
                <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <h1 class="mb-1">Admin activity</h1>
                        <p class="mb-0">
                            <span th:text="${totalCount}">0</span> recorded action(s) —
                            page <span th:text="${page}">1</span> of <span th:text="${totalPages}">1</span>
                        </p>
                    </div>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">
                        <i class="bi bi-arrow-left"></i> Dashboard
                    </a>
                </div>

                <section class="card shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h2 class="h6 mb-0">
                            <i class="bi bi-funnel text-primary me-1"></i> Filter
                        </h2>
                    </div>
                    <div class="card-body">
                        <form class="row g-2 align-items-end" method="get" th:action="@{/activity}">
                            <div class="col-sm-6 col-md-2">
                                <label class="form-label" for="filterEventType">Action</label>
                                <select class="form-select form-select-sm" id="filterEventType" name="eventType">
                                    <option value="">All actions</option>
                                    <option value="PROVISION" th:selected="${eventType == 'PROVISION'}">Provision</option>
                                    <option value="RESET_PASSWORD" th:selected="${eventType == 'RESET_PASSWORD'}">Reset password</option>
                                    <option value="REVOKE_USER" th:selected="${eventType == 'REVOKE_USER'}">Revoke user</option>
                                    <option value="DELETE" th:selected="${eventType == 'DELETE'}">Delete</option>
                                    <option value="WEBHOOK_CREATED" th:selected="${eventType == 'WEBHOOK_CREATED'}">Create webhook</option>
                                    <option value="WEBHOOK_UPDATED" th:selected="${eventType == 'WEBHOOK_UPDATED'}">Update webhook</option>
                                    <option value="WEBHOOK_DELETED" th:selected="${eventType == 'WEBHOOK_DELETED'}">Delete webhook</option>
                                    <option value="BACKUP_CREATED" th:selected="${eventType == 'BACKUP_CREATED'}">Backup</option>
                                    <option value="BACKUP_RESTORED" th:selected="${eventType == 'BACKUP_RESTORED'}">Restore</option>
                                    <option value="IMPORT" th:selected="${eventType == 'IMPORT'}">Import</option>
                                </select>
                            </div>
                            <div class="col-sm-6 col-md-2">
                                <label class="form-label" for="filterEngineType">Engine</label>
                                <select class="form-select form-select-sm" id="filterEngineType" name="engineType">
                                    <option value="">All engines</option>
                                    <option value="MONGO" th:selected="${engineType == 'MONGO'}">MongoDB</option>
                                    <option value="POSTGRES" th:selected="${engineType == 'POSTGRES'}">PostgreSQL</option>
                                </select>
                            </div>
                            <div class="col-sm-6 col-md-2">
                                <label class="form-label" for="filterDbName">Database</label>
                                <input class="form-control form-control-sm" id="filterDbName" name="dbName"
                                       placeholder="e.g. myapp" type="text" th:value="${dbName}">
                            </div>
                            <div class="col-sm-6 col-md-3">
                                <label class="form-label" for="filterUserName">User</label>
                                <input class="form-control form-control-sm" id="filterUserName" name="userName"
                                       placeholder="e.g. appuser" type="text" th:value="${userName}">
                            </div>
                            <div class="col-sm-6 col-md-3">
                                <label class="form-label" for="filterPerformedBy">Performed by</label>
                                <input class="form-control form-control-sm" id="filterPerformedBy" name="performedBy"
                                       placeholder="e.g. admin" type="text" th:value="${performedBy}">
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button class="btn btn-sm btn-primary" type="submit">
                                    <i class="bi bi-search"></i> Apply
                                </button>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/activity}">
                                    <i class="bi bi-x-lg"></i> Clear
                                </a>
                            </div>
                        </form>
                    </div>
                </section>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="empty-state" th:if="${#lists.isEmpty(events)}">
                            <span class="empty-state-icon"><i class="bi bi-clock-history"></i></span>
                            <p class="empty-state-title">No matching activity</p>
                            <p class="empty-state-text">Try adjusting your filters or clear them to see all activity.</p>
                        </div>
                        <div class="table-responsive" th:if="${!#lists.isEmpty(events)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Action</th>
                                        <th>Engine</th>
                                        <th>Database</th>
                                        <th>User</th>
                                        <th>By</th>
                                        <th>When</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="event : ${events}">
                                        <td>
                                    <span th:class="${event.eventType == 'DELETE'} ? 'badge badge-soft-danger'
                                        : (${event.eventType == 'PROVISION'} ? 'badge badge-soft-success' : 'badge badge-soft-info')"
                                          th:text="${#strings.replace(event.eventType, '_', ' ')}">PROVISION</span>
                                        </td>
                                        <td><span class="badge badge-soft-secondary" th:text="${event.engineType} ?: '—'">MONGO</span></td>
                                        <td th:text="${event.dbName}">myapp</td>
                                        <td th:text="${event.userName} ?: '—'">appuser</td>
                                        <td th:text="${event.performedBy}">admin</td>
                                        <td class="text-body-secondary" th:text="${event.performedAt}">-</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center"
                         th:if="${!#lists.isEmpty(events)}">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/activity(page=${page - 1}, eventType=${eventType}, engineType=${engineType}, dbName=${dbName}, userName=${userName}, performedBy=${performedBy})}"
                           th:if="${hasPrev}">
                            <i class="bi bi-chevron-left"></i> Previous
                        </a>
                        <span class="text-body-secondary small" th:text="'Page ' + ${page} + ' of ' + ${totalPages}">Page 1 of 1</span>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/activity(page=${page + 1}, eventType=${eventType}, engineType=${engineType}, dbName=${dbName}, userName=${userName}, performedBy=${performedBy})}"
                           th:if="${hasNext}">
                            Next <i class="bi bi-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
