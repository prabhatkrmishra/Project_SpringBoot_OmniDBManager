<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Users · ' + ${database.dbName})}"></head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments/nav :: nav('database')}"></aside>

        <div class="main">
            <main th:replace="~{fragments/nav :: flash}"></main>

            <main class="container-xxl py-4">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a class="link-primary" th:href="@{/}">Dashboard</a></li>
                        <li class="breadcrumb-item"><a class="link-primary"
                                                       th:href="${engine != null and engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}(name=${database.dbName})} : (${engine != null and engine.name() == 'MYSQL'} ? @{/mysql/databases/{name}(name=${database.dbName})} : @{/databases/{name}(name=${database.dbName})})"
                                                       th:text="${database.dbName}">database</a></li>
                        <li class="breadcrumb-item active">Users</li>
                    </ol>
                </nav>

                <section class="card shadow-sm mb-4">
                    <div class="card-header bg-transparent d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h2 class="h5 mb-0">
                            <i class="bi bi-people text-primary me-1"></i>
                            Users in <span th:text="${database.dbName}">database</span>
                        </h2>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="${engine != null and engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}(name=${database.dbName})} : (${engine != null and engine.name() == 'MYSQL'} ? @{/mysql/databases/{name}(name=${database.dbName})} : @{/databases/{name}(name=${database.dbName})})">
                            <i class="bi bi-arrow-left"></i> Back to database
                        </a>
                    </div>
                    <div class="card-body p-0">
                        <p class="text-body-secondary p-3 mb-0" th:if="${#lists.isEmpty(users)}">
                            No users found in this database.
                        </p>
                        <div class="table-responsive" th:if="${!#lists.isEmpty(users)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Roles</th>
                                        <th>Auth Source</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td>
                                            <i class="bi bi-person text-primary me-1"></i>
                                            <span th:text="${user.userName}">user</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-soft-info me-1"
                                                  th:each="role : ${user.roles}"
                                                  th:text="${role}">readWrite:db</span>
                                        </td>
                                        <td th:text="${user.authSource}">db</td>
                                        <td class="text-end">
                                            <form class="d-inline"
                                                  method="post"
                                                  th:action="${engine != null and engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}/users/{uname}/delete(name=${database.dbName}, uname=${user.userName})} : (${engine != null and engine.name() == 'MYSQL'} ? @{/mysql/databases/{name}/users/{uname}/delete(name=${database.dbName}, uname=${user.userName})} : @{/databases/{name}/users/{uname}/delete(name=${database.dbName}, uname=${user.userName})})"
                                                  th:attr="data-confirm='Revoke access for user ' + ${user.userName} + '? This cannot be undone.'">
                                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                                    <i class="bi bi-person-dash"></i> Revoke
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
