<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head(${engine.name() == 'POSTGRES'} ? 'PostgreSQL' : 'MongoDB')}"></head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments/nav :: nav('engine-home')}"></aside>
        <div class="main">
            <div th:replace="~{fragments/nav :: flash}"></div>
            <main class="container-xxl py-4">
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1 th:text="${engine.name() == 'POSTGRES'} ? 'PostgreSQL' : 'MongoDB'">MongoDB</h1>
                        <p class="text-body-secondary" th:text="${#lists.size(databases)} + ' databases'">0 databases</p>
                    </div>
                    <a class="btn btn-primary" th:href="${engine.name() == 'POSTGRES'} ? @{/provision/postgres} : @{/provision/mongo}" th:if="${canWrite}">
                        <i class="bi bi-plus-circle me-1"></i> New database
                    </a>
                </div>
                <div class="alert alert-warning" th:if="${postgresError}" th:text="${postgresError}">Error</div>
                <section class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="empty-state" th:if="${#lists.isEmpty(databases)}">
                            <span class="empty-state-icon"><i class="bi bi-database"></i></span>
                            <p class="empty-state-title">No databases yet</p>
                            <p class="empty-state-text">Provision your first database to get started.</p>
                        </div>
                        <div class="table-responsive" th:if="${!#lists.isEmpty(databases)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead><tr><th>Database</th><th>User</th><th>Storage Size</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                                <tbody>
                                    <tr th:each="database : ${databases}">
                                        <td><i class="bi bi-database text-primary me-2"></i><span class="fw-medium" th:text="${database.dbName}">app_db</span> <span class="badge engine-badge-mongo ms-1" th:if="${database.engineType != null}" th:text="${database.engineType}">MONGO</span></td>
                                        <td th:text="${database.userName} ?: '—'">app_user</td>
                                        <td th:text="${database.sizeBytes} + ' B'">0 B</td>
                                        <td><span class="badge badge-soft-success" th:if="${database.provisioned}">provisioned</span><span class="badge badge-soft-secondary" th:if="${!database.provisioned}">external</span></td>
                                        <td class="text-end text-nowrap">
                                            <div class="btn-group btn-group-sm">
                                                <a class="btn btn-outline-primary" th:href="${engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}(name=${database.dbName})} : @{/mongo/databases/{name}(name=${database.dbName})}" title="View"><i class="bi bi-eye"></i></a>
                                                <a class="btn btn-outline-secondary" th:href="${engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}/reset(name=${database.dbName})} : @{/mongo/databases/{name}/reset(name=${database.dbName})}" th:if="${canWrite}" title="Reset"><i class="bi bi-key"></i></a>
                                                <a class="btn btn-outline-danger" th:href="${engine.name() == 'POSTGRES'} ? @{/postgres/databases/{name}/delete(name=${database.dbName})} : @{/mongo/databases/{name}/delete(name=${database.dbName})}" th:if="${canWrite}" title="Delete"><i class="bi bi-trash"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
