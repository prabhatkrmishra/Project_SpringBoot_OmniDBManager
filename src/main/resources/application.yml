spring:
  application:
    name: omnidb-manager

  mongodb:
    # Local MongoDB (Docker Compose). The app connects as the Mongo root/admin user
    # to provision databases and per-database users. maxPoolSize is capped well
    # below the driver default of 100 - this is a single-admin control plane, so
    # 10 connections bound socket/buffer memory without starving the parallel
    # collStats reads (16) or the SSE monitor.
    uri: ${MONGODB_URI:mongodb://${MONGODB_ROOT_USERNAME:root}:${MONGODB_ROOT_PASSWORD:root}@127.0.0.1:9812/?authSource=admin&maxPoolSize=10}
    # Default database used by Spring Data repositories (provisioning metadata).
    database: mongodb_admin

  thymeleaf:
    cache: false
  web:
    error:
      whitelabel:
        enabled: false
  servlet:
    multipart:
      # Restore uploads are full database backups (gzip'd JSON). Spring's
      # defaults (1 MB file / 10 MB request) are far too small for that.
      max-file-size: 256MB
      max-request-size: 256MB

server:
  port: 9811
  # Loopback-only by default: reach the app through a reverse proxy/tunnel
  # (e.g. Cloudflare). Set SERVER_ADDRESS=0.0.0.0 to expose directly.
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Trust X-Forwarded-* set by the reverse proxy/tunnel (HTTPS scheme, real IP).
  forward-headers-strategy: framework
  tomcat:
    threads:
      # Single-admin app: Tomcat's default pool (200 max threads, each with a
      # thread stack) is far more than this deployment can ever use. SSE streams
      # are async and do not hold request threads.
      max: 20
      min-spare: 2
    # Timeouts to prevent thread starvation when PG/MySQL hang (Phase 2).
    # connection-timeout is socket read timeout for HTTP; async timeout for SSE.
    connection-timeout: 10s
    accept-count: 100
    max-connections: 100
  mvc:
    async:
      request-timeout: 30s
  servlet:
    session:
      cookie:
        # Default false for local http (127.0.0.1:9811); set SERVER_COOKIE_SECURE=true behind TLS proxy.
        secure: ${SERVER_COOKIE_SECURE:false}
        http-only: true
        same-site: ${SERVER_COOKIE_SAME_SITE:lax}
      timeout: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

# Web app admin account (from .env)
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
    # When true, refuse to start with the default admin credentials even outside
    # the atlas profile (e.g. a hardened local/CI deployment).
    enforce-strong-credentials: ${APP_ADMIN_ENFORCE_STRONG:false}
  mongo:
    enabled: ${MONGO_ENABLED:false}
  # Public Mongo host used in the connection strings shown in the UI (set when
  # Mongo is reachable via a domain name, e.g. behind a reverse proxy/tunnel).
  # Add ":port" only if clients must reach a non-default port (drivers default
  # to 27017). Empty by default: derived from spring.mongodb.uri / local fallback.
  mongo-public-host: ${MONGODB_PUBLIC_HOST:}
  # Set true when clients reach MongoDB through a TLS-terminating TCP proxy
  # (e.g. nginx stream) or mongod itself serves TLS; issued connection strings
  # then carry &tls=true so drivers encrypt the wire from day one.
  mongo-public-tls: ${MONGODB_PUBLIC_TLS:false}
  # Bundled mongo-express UI, reverse-proxied at /mongo-express (from .env)
  mongo-express:
    base-url: ${MONGO_EXPRESS_BASE_URL:http://127.0.0.1:9814/mongo-express}
    username: ${MONGO_EXPRESS_USERNAME:admin}
    password: ${MONGO_EXPRESS_PASSWORD:admin}
  postgres:
    enabled: ${POSTGRES_ENABLED:false}
    uri: ${POSTGRES_URI:jdbc:postgresql://127.0.0.1:9813/postgres?sslmode=disable&connectTimeout=5&socketTimeout=10}
    public-host: ${POSTGRES_PUBLIC_HOST:}
    public-tls: ${POSTGRES_PUBLIC_TLS:false}
    public-sslmode: ${POSTGRES_PUBLIC_SSLMODE:require}
  mysql:
    enabled: ${MYSQL_ENABLED:false}
    uri: ${MYSQL_URI:jdbc:mysql://127.0.0.1:9816/mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=10000}
    public-host: ${MYSQL_PUBLIC_HOST:}
    public-tls: ${MYSQL_PUBLIC_TLS:false}
    public-sslmode: ${MYSQL_PUBLIC_SSLMODE:REQUIRED}
  adminer:
    base-url: ${ADMINER_BASE_URL:http://127.0.0.1:9815}
  phpmyadmin:
    base-url: ${PHPMYADMIN_BASE_URL:http://127.0.0.1:9817}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  # Brute-force protection on the login form (attempts per IP+username per window)
  login-rate-limit:
    max-attempts: 5
    window: 15m
    # Honor X-Forwarded-For only when a trusted reverse proxy is in front of the
    # app (enable behind Cloudflare Tunnel; keep false when reachable directly).
    trust-x-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}
  # Per-engine rate limit on provision/reset/delete (attempts per IP+engine per window)
  provision-rate-limit:
    max-attempts: 5
    window: 1m
    trust-x-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}
