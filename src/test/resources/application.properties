# Test-only defaults. Not secrets.
#
# EncryptionGuard refuses to start when APP_ENCRYPTION_KEY is absent, and
# @SpringBootTest runs ApplicationRunner beans, so every test that boots a real
# context needs a key present or it dies during context load. Supplying a fixed
# one here keeps those tests running with encryption switched on, which is closer
# to production than waiving enforcement would be.
#
# Why this value is safe to commit:
#   - src/test/resources is not packaged. Verified against both built jars in
#     target/: no application.properties in either.
#   - Spring Boot precedence puts application.properties BELOW environment
#     variables, @DynamicPropertySource and command-line args, so this can be
#     overridden by CI or by an individual test but can never shadow real
#     configuration. It is a floor, not a ceiling.
#   - 64 hex chars == 32 bytes, the format EncryptionService requires.
#   - The literal is a repeated digit/letter sequence, not key material: it
#     protects nothing, and it encrypts nothing that matters outside tests.
#     Production reads app.encryption.key from APP_ENCRYPTION_KEY, which
#     application.yml still defaults to empty.
app.encryption.key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
