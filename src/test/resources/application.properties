# Test-only defaults. Not secrets.
#
# EncryptionGuard now refuses to start when APP_ENCRYPTION_KEY is absent, and
# @SpringBootTest runs ApplicationRunner beans, so integration tests that boot a
# real context need a key present or they fail during context load. Supplying a
# fixed one here keeps those tests running with encryption switched on, which is
# closer to production than the previous default rather than further from it.
#
# 64 hex chars == 32 bytes, the format EncryptionService requires.
app.encryption.key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
