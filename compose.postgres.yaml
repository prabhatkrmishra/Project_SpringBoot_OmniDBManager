# PostgreSQL engine — run standalone with:
#   docker compose -f compose.postgres.yaml up -d
# Or all engines via the orchestrator:
#   docker compose up -d
services:
  # One-shot init that guarantees the PGDATA volume is owned by the postgres
  # UID (999) before the server starts. Named volumes are normally initialized
  # from the image with the right ownership, but this makes bind mounts and
  # pre-existing volumes robust too (the official entrypoint skips its root
  # chown when the container runs as UID 999 under cap_drop ALL).
  # NOTE: must mount the volume at the SAME path as postgres (/var/lib/postgresql)
  # and create the PGDATA subdir, so the server sees a writable PGDATA.
  postgres-init:
    image: busybox:1.36
    container_name: omnidb-postgres-init
    restart: "no"
    user: "0:0"
    volumes:
      - postgres-data:/var/lib/postgresql
    command: ["sh", "-c", "mkdir -p /var/lib/postgresql/18/docker && chown -R 999:999 /var/lib/postgresql/18/docker && chmod 700 /var/lib/postgresql/18/docker"]

  postgres:
    # Pinned to the multi-arch index digest for reproducibility (tag alone can
    # drift on rebuild). Bump deliberately and re-resolve with:
    #   docker buildx imagetools inspect pgvector/pgvector:0.8.6-pg18-trixie
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    container_name: omnidb-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:9813:5432"
    shm_size: 1g
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run/postgresql
    user: "999:999"
    # Small-VPS guardrails (see README "Memory footprint"): cap total memory so
    # postgres + pgvector HNSW builds cannot crowd out the JVM, and raise the
    # open-file limit to match the other engines.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    mem_limit: 1g
    # Enterprise hardening: scram-sha-256 is PG18 default; explicit command keeps it
    # pinned even if image defaults change. TLS enabled with a CA-signed server cert
    # (certs/ dir on host, chowned to UID 999 so the read-only container can read them).
    # Public connection strings carry sslmode=require (OVERRIDE_POSTGRES_SSLMODE=require).
    command: ["postgres",
      "-c", "password_encryption=scram-sha-256",
      "-c", "ssl=on",
      "-c", "ssl_cert_file=/var/lib/postgresql/server.crt",
      "-c", "ssl_key_file=/var/lib/postgresql/server.key",
      "-c", "ssl_ca_file=/var/lib/postgresql/ca.crt"]
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-root}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/server.key:ro
      - ./certs/ca.crt:/var/lib/postgresql/ca.crt:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:6.0.1-standalone
    container_name: omnidb-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9815:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PgBouncer — pooling for Postgres, managed like pgvector (always on with postgres).
  # Same Docker network as postgres (host=postgres:5432 internally).
  # Static wildcard `*` database — any DB provisioned with pooling just works, no RELOAD file dance.
  # Host-side loopback-bound 127.0.0.1:6432 via the ports mapping below
  # (safe/closed); the pooler itself must listen on * inside its netns.
  # Config lives in named volume `pgbouncer-data` (no host folder), written by one-shot init below.
  pgbouncer-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    container_name: omnidb-pgbouncer-init
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    # No cap_drop here: this one-shot runs as root only to chown userlist.txt
    # down to the pgbouncer runtime user (postgres), which needs CAP_CHOWN.
    tmpfs:
      - /tmp
    volumes:
      - pgbouncer-data:/etc/pgbouncer
      # Host certs (same ./certs dir the postgres service uses). Read-only;
      # staged into the volume only when the proxy TLS gate is on.
      - ./certs:/host-certs:ro
    environment:
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:-change-me-now}
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD:-change-me-now}
      # SCRAM credential for the pooler's auth_user (pgbouncer_auth). Written
      # plain-text into userlist.txt — required form for auth_type
      # scram-sha-256 (md5 hashes do not work for SCRAM). File stays 600,
      # pooler-uid-owned, in a named volume, never logged.
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-change-me-now}
      # Pool sizing single-sourced with application.yml (app.pgbouncer.*) —
      # same env vars drive both so the ini and the app cannot drift apart.
      # Conservative §17 defaults: 5/2/3s/10 (not 25/5/50) so many-DB
      # deployments cannot exhaust max_connections=100 on a small VPS.
      OVERRIDE_PGBOUNCER_POOL_MODE: ${OVERRIDE_PGBOUNCER_POOL_MODE:-transaction}
      OVERRIDE_PGBOUNCER_MAX_CLIENT_CONN: ${OVERRIDE_PGBOUNCER_MAX_CLIENT_CONN:-1000}
      OVERRIDE_PGBOUNCER_DEFAULT_POOL_SIZE: ${OVERRIDE_PGBOUNCER_DEFAULT_POOL_SIZE:-5}
      OVERRIDE_PGBOUNCER_RESERVE_POOL_SIZE: ${OVERRIDE_PGBOUNCER_RESERVE_POOL_SIZE:-2}
      OVERRIDE_PGBOUNCER_RESERVE_POOL_TIMEOUT: ${OVERRIDE_PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      OVERRIDE_PGBOUNCER_MAX_DB_CONNECTIONS: ${OVERRIDE_PGBOUNCER_MAX_DB_CONNECTIONS:-10}
      # Pooler-TLS gate: mirrors DatabaseProxyProperties.isConfigured().
      # Set DATABASE_PROXY_ENABLED=true ONLY with the pooled hostname set
      # (cutover gate preconditions) — enabling it switches the pooler to
      # client_tls_sslmode=require because the proxy uses TLS passthrough.
      DATABASE_PROXY_ENABLED: ${DATABASE_PROXY_ENABLED:-false}
      DATABASE_PROXY_DIRECT_HOST: ${DATABASE_PROXY_DIRECT_HOST:-}
      DATABASE_PROXY_POOLED_HOST: ${DATABASE_PROXY_POOLED_HOST:-}
    command:
      - sh
      - -c
      - |
        set -eu
        ADMIN_USER=pgbouncer_admin
        STATS_USER=pgbouncer_stats
        AUTH_USER=pgbouncer_auth
        POOL_MODE="$${OVERRIDE_PGBOUNCER_POOL_MODE:-transaction}"
        MAX_CLIENT_CONN="$${OVERRIDE_PGBOUNCER_MAX_CLIENT_CONN:-1000}"
        DEFAULT_POOL_SIZE="$${OVERRIDE_PGBOUNCER_DEFAULT_POOL_SIZE:-5}"
        RESERVE_POOL_SIZE="$${OVERRIDE_PGBOUNCER_RESERVE_POOL_SIZE:-2}"
        RESERVE_POOL_TIMEOUT="$${OVERRIDE_PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}"
        MAX_DB_CONNECTIONS="$${OVERRIDE_PGBOUNCER_MAX_DB_CONNECTIONS:-10}"
        # ALL secrets are plain-text: with auth_type=scram-sha-256 the pooler
        # cannot do SCRAM from an md5 hash ("user has MD5 secret" — breaks the
        # stats healthcheck AND the admin console used for PAUSE/RESUME/
        # RECONNECT). File stays 600, pooler-uid-owned, in a named volume.
        # Avoid double-quote/backslash in these passwords or the line malforms
        # and logins fail closed (loud, not silent).
        authline() { u="$$1"; p="$$2"; printf '"%s" "%s"\n' "$$u" "$$p"; }
        # NOTE: the [databases] line is whitespace-tokenized (key=value per
        # token), so a spaced auth_query must be SINGLE-quoted — that is the
        # only quoting cstr_get_value understands (double quotes do not work).
        # Verified against the 1.24.1 parser source. $1 is bound as a query
        # parameter by the pooler itself (no quoting concerns). (Comment kept
        # out of the heredoc below: an unquoted $1 in there would trip set -u.)
        cat > /etc/pgbouncer/pgbouncer.ini <<INI
        [databases]
        * = host=postgres port=5432 auth_user=$${AUTH_USER} auth_query='SELECT * FROM pgbouncer.user_lookup(\$$1)'
        [pgbouncer]
        listen_port = 6432
        # Bind all container interfaces: 127.0.0.1 here would mean the
        # CONTAINER's loopback only, so host-side connections through the
        # published port get refused (nothing listens on the container eth0).
        # External exposure is still governed by this service's ports mapping
        # (host loopback only) + the proxy as the single public bridge.
        listen_addr = *
        auth_type = scram-sha-256
        auth_file = /etc/pgbouncer/userlist.txt
        auth_user = $${AUTH_USER}
        pool_mode = $${POOL_MODE}
        max_client_conn = $${MAX_CLIENT_CONN}
        default_pool_size = $${DEFAULT_POOL_SIZE}
        reserve_pool_size = $${RESERVE_POOL_SIZE}
        reserve_pool_timeout = $${RESERVE_POOL_TIMEOUT}
        max_db_connections = $${MAX_DB_CONNECTIONS}
        server_reset_query = DISCARD ALL
        ignore_startup_parameters = extra_float_digits
        admin_users = pgbouncer_admin
        stats_users = pgbouncer_stats
        INI
        # S-06 pooled-route TLS. Two legs (see deploy/database-proxy.stream.conf):
        #   leg 1 (client->proxy->pooler): TLS passthrough, terminates at PgBouncer.
        #   leg 2 (pooler->postgres): pooler is the TLS client (server_tls_*).
        # Gate mirrors DatabaseProxyProperties.isConfigured(): enabled + both
        # hostnames set + different. verify-full is deliberately NOT used for the
        # backend leg: the pooler dials internal hostname `postgres`, which the
        # public-SAN cert does not cover — `require` gives encryption without a
        # hostname check that could never pass. Fail CLOSED when enabled but the
        # cert files are missing (never silently run plaintext as public-TLS).
        if [ "$${DATABASE_PROXY_ENABLED:-false}" = "true" ] && [ -n "$${DATABASE_PROXY_POOLED_HOST:-}" ]; then
          mkdir -p /etc/pgbouncer/certs
          if [ -f /host-certs/pool.crt ] && [ -f /host-certs/pool.key ]; then
            cp /host-certs/pool.crt /etc/pgbouncer/certs/pool.crt
            cp /host-certs/pool.key /etc/pgbouncer/certs/pool.key
          elif [ -f /host-certs/server.crt ] && [ -f /host-certs/server.key ]; then
            echo "pgbouncer-init: no pool.crt/pool.key — reusing server.crt/server.key (SAN must cover pooled hostname)"
            cp /host-certs/server.crt /etc/pgbouncer/certs/pool.crt
            cp /host-certs/server.key /etc/pgbouncer/certs/pool.key
          else
            echo "FATAL: DATABASE_PROXY_ENABLED=true but no pool.{crt,key} or server.{crt,key} in ./certs — refusing plaintext pooler" >&2
            exit 1
          fi
          if [ -f /host-certs/ca.crt ]; then cp /host-certs/ca.crt /etc/pgbouncer/certs/ca.crt; fi
          chmod 644 /etc/pgbouncer/certs/pool.crt
          chmod 600 /etc/pgbouncer/certs/pool.key
          chown 70:70 /etc/pgbouncer/certs/pool.crt /etc/pgbouncer/certs/pool.key
          cat >> /etc/pgbouncer/pgbouncer.ini <<'TLSINI'
        client_tls_sslmode = require
        client_tls_cert_file = /etc/pgbouncer/certs/pool.crt
        client_tls_key_file = /etc/pgbouncer/certs/pool.key
        client_tls_protocols = secure
        server_tls_sslmode = require
        server_tls_protocols = secure
        TLSINI
        fi
                { authline "$$ADMIN_USER" "$$PGBOUNCER_ADMIN_PASSWORD"; authline "$$STATS_USER" "$$PGBOUNCER_STATS_PASSWORD"; authline "$$AUTH_USER" "$$PGBOUNCER_AUTH_PASSWORD"; } > /etc/pgbouncer/userlist.txt
        chmod 600 /etc/pgbouncer/userlist.txt
        # The pgbouncer image runs as uid:gid 70:70, so hand it ownership of
        # the credentials file (stays 600) — otherwise it fails to open auth_file
        # and every pooled login breaks. Numeric id because busybox has no
        # postgres name entry. The ini stays root-owned 644 (world-readable).
        chown 70:70 /etc/pgbouncer/userlist.txt
  # Single-port Database Proxy (Nginx stream + ssl_preread SNI routing).
  # Opt-in via the `database-proxy` compose profile (NOT started by plain
  # `up -d`) + DATABASE_PROXY_ENABLED=true with the pooled hostname set —
  # both required, per the cutover gate (deploy/s06-cutover-gate.md).
  # Pooled-only public shape: the single public port serves the pooled link
  # (db hostname → PgBouncer); direct has NO public route (loopback on-box,
  # SSH tunnel from outside). No tenant passwords here — TLS passthrough
  # only; PostgreSQL stays the auth authority. Unknown SNI has no route.
  database-proxy:
    profiles:
      - database-proxy
    # Pinned to the multi-arch index digest (resolves per-arch on pull).
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: omnidb-database-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
      - /run-rendered
    ports:
      - "${DATABASE_PROXY_BIND:-127.0.0.1}:${DATABASE_PROXY_PORT:-14291}:14291"
    environment:
      # Pooled public hostname (the single SNI entry). DIRECT_HOST optional —
      # set it (different value) only for the dual-link shape.
      DATABASE_PROXY_POOLED_HOST: ${DATABASE_PROXY_POOLED_HOST:-db.example.com}
      DATABASE_PROXY_DIRECT_HOST: ${DATABASE_PROXY_DIRECT_HOST:-}
    volumes:
      # Template uses envsubst placeholders ONLY for the hostname
      # (nginx-native $vars are $$-escaped); rendered at container start.
      - ./deploy/database-proxy.stream.conf:/tpl/nginx.conf.tpl:ro
    command:
      - sh
      - -c
      - |
        set -eu
        envsubst < /tpl/nginx.conf.tpl > /run-rendered/nginx.conf
        nginx -t -c /run-rendered/nginx.conf
        exec nginx -c /run-rendered/nginx.conf -g 'daemon off;'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    # Maintained image (the pgbouncer/pgbouncer repo is stale); pre-existing
    # pgbouncer.ini/userlist.txt mounts win over the entrypoint generator.
    image: edoburu/pgbouncer:v1.24.1-p1@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
    container_name: omnidb-pgbouncer
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run
    ports:
      - "127.0.0.1:${OVERRIDE_PGBOUNCER_PORT:-6432}:6432"
    environment:
      DATABASE_PROXY_ENABLED: ${DATABASE_PROXY_ENABLED:-false}
      # Stats credential for the healthcheck only — the entrypoint ignores
      # unknown vars, so this never touches userlist.txt (DB_USER/DATABASE_URL
      # must stay unset for the same reason).
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD:-change-me-now}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer-init:
        condition: service_completed_successfully
    volumes:
      - pgbouncer-data:/etc/pgbouncer:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${DATABASE_PROXY_ENABLED:-false}\" = \"true\" ]; then export PGSSLMODE=require; fi; PGPASSWORD=\"$PGBOUNCER_STATS_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U pgbouncer_stats -d pgbouncer -tAc 'SHOW POOLS' | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  pgbouncer-data:
