# MySQL engine — run standalone with:
#   docker compose -f compose.mysql.yaml up -d
# Or all engines via the orchestrator:
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: omnidb-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:9816:3306"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/run/mysqld
    user: "999:999"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-authentication-plugin=caching_sha2_password"]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: omnidb-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:9817:80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
